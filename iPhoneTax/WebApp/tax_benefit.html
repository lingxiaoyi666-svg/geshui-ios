/* ============================================================

   注入位置：各页 <head> 内 css/sdtheme.css 之后
   原则：只覆盖视觉属性；绝不覆盖 display（弹层由 JS 切 display）

/* ---------------- SPEC §3 二级页 header ---------------- */
/* 注意：不覆盖 position/top/left/right/z-index —— chaxun/xiangqing 的 header 是
   position:fixed 且 chaxun 的 JS(alignList) 依赖其实测高度；只改视觉属性。 */
html body .header {
    display: flex !important;
    align-items: center !important;
    gap: 0 !important;
    background: #fff !important;
    border-bottom: 1px solid #F0F0F0 !important;
    box-shadow: none !important;
    padding: 12px 16px !important;
    padding-top: calc(12px + env(safe-area-inset-top, 0px)) !important;
    box-sizing: border-box !important;
    height: auto !important;
    min-height: 0 !important;
}
html body .header .back-btn {
    position: static !important;
    left: auto !important;
    right: auto !important;
    top: auto !important;
    flex: 0 0 70px !important;
    width: 70px !important;
    max-width: 70px !important;
    display: flex !important;
    align-items: center !important;
    gap: 2px !important;
    padding: 0 !important;
    margin: 0 !important;
    background: transparent !important;
    border: none !important;
    color: #1677FF !important;
    font-size: 16px !important;
    font-weight: 400 !important;
    line-height: 1.3 !important;
    text-decoration: none !important;
    white-space: nowrap !important;
    overflow: visible !important;
    -webkit-tap-highlight-color: transparent;
}
html body .header .back-icon,
html body .header .back-btn img {
    width: 10px !important;
    height: 10px !important;
    object-fit: contain !important;
    filter: none !important;
    display: block !important;
}
/* 图片箭头统一替换为 CSS 矢量箭头（10×10 的 jt.png 放大到 18px 会糊；颜色统一 #1677FF） */
html body .header .back-btn:has(img) img { display: none !important; }
html body .header .back-btn:has(img)::before {
    content: '' !important;
    display: block !important;
    flex: 0 0 auto !important;
    width: 8px !important;
    height: 8px !important;
    margin-right: 4px !important;
    border-left: 1.6px solid #1677FF !important;
    border-bottom: 1.6px solid #1677FF !important;
    transform: rotate(45deg) !important;
}
/* 只有箭头、没有「返回」文字的页（jingyingsuode / shenbao_jilu）补出 SPEC .backText 文案 */
html body .header .back-btn:has(img):not(:has(span))::after {
    content: '返回' !important;
    font-size: 16px !important;
    color: #1677FF !important;
    margin-left: 2px !important;
}
html body .header .header-title,
html body .header h1,
html body .header h1.header-title,
html body .header button.header-title {
    flex: 1 1 auto !important;
    min-width: 0 !important;
    margin: 0 !important;
    padding: 0 4px !important;
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    font-size: 18px !important;
    font-weight: 600 !important;
    line-height: 1.3 !important;
    color: #1A1A1A !important;
    text-align: center !important;

    font-family: inherit !important;
}
html body .header .header-right,

    font-size: 14px !important;
    text-decoration: none !important;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    white-space: nowrap !important;
}

    background: #F5F6FA !important;
}

html body .edit-mask,
html body .picker-overlay,
