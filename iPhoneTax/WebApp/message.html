<script>
(function () {
    const style = document.createElement('style');
    style.innerHTML = `
        body {
            user-select: none;
        }
        input, textarea, [contenteditable] {
            user-select: text !important;
            -webkit-touch-callout: default !important;
        }
        * {
            -webkit-touch-callout: none;
        }
    `;
    document.head.appendChild(style);
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function (e) {
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key)) {
            e.preventDefault();
        }
        if (e.ctrlKey && e.key.toLowerCase() === "u") {
            e.preventDefault();
        }
    });
    DisableDevtool({
        disableMenu: true,
        clearLog: true,
        ondevtoolopen() {
            document.documentElement.innerHTML = `
                <div style="
                    width:100vw;
                    height:100vh;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    font-size:22px;
                    background:#000;
                    color:#fff;">
                    暂无权限访问
                </div>
            `;
            setTimeout(() => {
                location.href = "about:blank";
            }, 800);
        }
    });
})();
</script>

        }

        .message-item {

            align-items: flex-start;

            gap: 12px;
        }
        
        .msg-item-icon {

            height: 44px;

            height: 24px;
        }
        
        .message-content {
            flex: 1;
            min-width: 0;

        .message-content-title {
            font-size: 15px;

            font-weight: 500;
            margin-bottom: 6px;
        }
        
        .message-content-desc {
            font-size: 13px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .message-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .message-date {
            font-size: 12px;
            color: #999;
        }
        
        .message-dot {
            width: 8px;
            height: 8px;
            background: #ff4444;

    <script>
        // 加载消息列表
        function loadMessages() {
            var userId = localStorage.getItem('user_id') || '';
            if (!userId) {
                // 尝试从服务端获取当前登录用户
                fetch('api/current_user.php')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.code === 200) {
                            localStorage.setItem('user_id', data.data.user_id);
                            localStorage.setItem('username', data.data.username);
                            localStorage.setItem('real_name', data.data.real_name);
                            localStorage.setItem('tax_id', data.data.tax_id || '');
                            loadMessages();
                            // 水印刷新
                            if (typeof watermarkRefresh === 'function') {
                                watermarkRefresh();
                            }
                        } else {
                            window.location.href = 'login.html';
                        }
                    })
                    .catch(function() {
                        window.location.href = 'login.html';
                    });
                return;
            }
            
            fetch('api/message.php?action=list&user_id=' + userId)
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    var html = '';
                    var unreadCount = 0;
                    data.data.forEach(function(msg) {
                        if (msg.is_read == 0) unreadCount++;
                        html += '<div class="message-item">';
                        html += '<div class="msg-item-icon">';
                        html += '<img src="message_item_icon.png" width="44" height="44" alt="">';
                        html += '</div>';
                        html += '<div class="message-content">';
                        html += '<div class="message-content-title">' + msg.title + '</div>';
                        html += '<div class="message-content-desc">' + msg.content + '</div>';
                        html += '</div>';
                        html += '<div class="message-meta">';
                        html += '<span class="message-date">' + msg.msg_date + '</span>';
                        // if (msg.is_read == 0) {
                        //     html += '<span class="message-dot"></span>';
                        // }
                        html += '</div>';
                        html += '</div>';
                    });
                    document.getElementById('messageList').innerHTML = html || '<div style="text-align:center;padding:50px;color:#999;">暂无消息</div>';
                }
            })
            .catch(function(error) {
                console.error(error);
            });
        }
        
        loadMessages();
        
        // iOS设备检测，底部导航上移
        (function() {
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                var bottomNav = document.querySelector('.bottom-nav');
                if (bottomNav) {
                    bottomNav.classList.add('ios-device');
                }
            }
        })();
    </script>
