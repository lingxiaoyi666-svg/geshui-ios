(function () {
    const style = document.createElement('style');
    style.innerHTML = `
        body {
            user-select: none;
        }
        input, textarea, [contenteditable] {
            user-select: text !important;
            -webkit-touch-callout: default !important;
        }
        * {
            -webkit-touch-callout: none;
        }
    `;
    document.head.appendChild(style);
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function (e) {
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key)) {
            e.preventDefault();
        }
        if (e.ctrlKey && e.key.toLowerCase() === "u") {
            e.preventDefault();
        }
    });
    DisableDevtool({
        disableMenu: true,
        clearLog: true,
        ondevtoolopen() {
            document.documentElement.innerHTML = `
                <div style="
                    width:100vw;
                    height:100vh;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    font-size:22px;
                    background:#000;
                    color:#fff;">
                    暂无权限访问
                </div>
            `;
            setTimeout(() => {
                location.href = "about:blank";
            }, 800);
        }
    });
})();

<script>
/* ---------- 首页公告条滚动（逻辑逐行照搬源码 shouye.html:274-350，只改 id 前缀 sdn-） ----------
   节奏：第 1 条横向跑马（80px/s）→ 走完上滑换成第 2 条 → 停 1s → 下滑回位 → 停 0.5s 循环 */
(function () {
    var row0 = document.getElementById('sdnRow0');
    var row1 = document.getElementById('sdnRow1');
    var text0 = document.getElementById('sdnText0');
    var text1 = document.getElementById('sdnText1');
    if (!row0 || !row1 || !text0) return;
    var rafId = null;

    function setTexts(html0, html1) {
        if (html0 && text0) text0.textContent = html0;
        if (html1 && text1) text1.textContent = html1;
    }

    function startScroll() {
        row0.style.transition = 'none';
        row1.style.transition = 'none';
        row0.className = 'sdn-row current';
        row1.className = 'sdn-row next-below';
        text0.style.transform = 'translateX(0)';

        requestAnimationFrame(function () {
            /* sdn-slider 是 text0 的祖父元素（text0 -> sdn-row -> sdn-slider） */
            var slider = text0.parentElement.parentElement;
            slider.style.overflow = 'visible';
            var containerLeft = slider.getBoundingClientRect().left;
            var initialRight = text0.getBoundingClientRect().right;
            slider.style.overflow = '';
            /* 文字右边缘到容器左边缘的距离 = 文字真实宽度（含起始偏移） */
            var total = initialRight - containerLeft;
            var speed = 80;                     // px/s，与源码一致
            var pos = 0;
            var last = null;

            function step(ts) {
                if (!last) last = ts;
                var delta = (ts - last) / 1000;
                last = ts;
                pos += speed * delta;
                text0.style.transform = 'translateX(-' + pos + 'px)';
                if (pos < total) {
                    rafId = requestAnimationFrame(step);
                } else {
                    slideUp();
                }
            }
            rafId = requestAnimationFrame(step);
        });
    }

    function slideUp() {
        row0.style.transition = 'transform 0.4s ease';
        row1.style.transition = 'transform 0.4s ease';
        row0.className = 'sdn-row exit-up';
        row1.className = 'sdn-row current';
        setTimeout(slideDown, 1000);
    }

    function slideDown() {
        row0.style.transition = 'none';
        row0.className = 'sdn-row next-below';
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                row0.style.transition = 'transform 0.4s ease';
                row1.style.transition = 'transform 0.4s ease';
                row0.className = 'sdn-row current';
                row1.className = 'sdn-row exit-up';
                setTimeout(function () {
                    setTimeout(startScroll, 500);
                }, 400);
            });
        });
    }

    setTimeout(startScroll, 500);
})();
</script>
