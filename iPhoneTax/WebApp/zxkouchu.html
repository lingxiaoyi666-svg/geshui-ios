<script>
(function () {
    const style = document.createElement('style');
    style.innerHTML = `
        body {
            user-select: none;
        }
        input, textarea, [contenteditable] {
            user-select: text !important;
            -webkit-touch-callout: default !important;
        }
        * {
            -webkit-touch-callout: none;
        }
    `;
    document.head.appendChild(style);
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function (e) {
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key)) {
            e.preventDefault();
        }
        if (e.ctrlKey && e.key.toLowerCase() === "u") {
            e.preventDefault();
        }
    });
    DisableDevtool({
        disableMenu: true,
        clearLog: true,
        ondevtoolopen() {
            document.documentElement.innerHTML = `
                <div style="
                    width:100vw;
                    height:100vh;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    font-size:22px;
                    background:#000;
                    color:#fff;">
                    暂无权限访问
                </div>
            `;
            setTimeout(() => {
                location.href = "about:blank";
            }, 800);
        }
    });
})();
</script>

</head>
<body class="page-zxkouchu">
    <div class="header">
        <a href="bancha.html" class="back-btn">
            <img src="jt.png" alt="" style="width: 9px; vertical-align: middle;">
            <span>返回</span>

        <span class="header-title">专项附加扣除</span>

    <div class="grid-wrap">

            <button type="button" class="zxk-item" data-category="继续教育">

                    <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">

                        <text x="26" y="34" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">¥</text>
                    </svg>
                </span>
                <span class="label">住房贷款利息</span>
            </button>
            <button type="button" class="zxk-item" data-category="住房租金">
                <span class="icon-wrap">
                    <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">

                        <path d="M26 32v6" stroke="#fff" stroke-width="2"/>

            <button type="button" class="zxk-item" data-category="赡养老人">
                <span class="icon-wrap">
                    <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
                        <circle cx="26" cy="18" r="8" fill="#ffb74d"/>
                        <path d="M14 44c0-8 5.4-14 12-14s12 6 12 14H14z" fill="#ff9800"/>
                    </svg>
                </span>
                <span class="label">赡养老人</span>
            </button>
            <button type="button" class="zxk-item" data-category="3岁以下婴幼儿照护">
                <span class="icon-wrap">
                    <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
                        <circle cx="22" cy="16" r="6" fill="#f48fb1"/>
                        <circle cx="32" cy="20" r="5" fill="#fce4ec" stroke="#f48fb1"/>
                        <path d="M12 40c2-8 8-12 16-12s14 4 16 12H12z" fill="#ec407a" opacity="0.85"/>
                    </svg>
                </span>
                <span class="label">3岁以下婴幼儿照护</span>
            </button>
        </div>
    </div>

    <section class="records">
        <div class="voided-banner" id="voidedBanner">当前查看已作废的扣除信息</div>
        <div class="records-head">
            <span class="records-title">填报记录</span>
            <div class="year-select-wrap">
                <span>选择查询年度：</span>
                <select id="yearSelect" aria-label="选择查询年度"></select>
            </div>
        </div>
        <ul class="record-list" id="recordList"></ul>
        <div class="records-empty" id="recordsEmpty" style="display:none;">暂无扣除信息</div>
        <div class="records-footer">
            <button type="button" id="btnToggleVoided">查看已作废的扣除信息 &gt;</button>
        </div>
    </section>

    <div id="recordModal" class="modal-root" role="dialog" aria-modal="true">
        <div class="modal-mask" id="recordModalMask"></div>
        <div class="modal-panel">
            <p class="modal-title" id="recordModalTitle">添加扣除信息</p>
            <div class="form-field">
                <label for="fCategory">扣除类型</label>
                <select id="fCategory"></select>
            </div>
            <div class="form-field" id="relatedNameWrap">
                <label for="fRelatedName">关联人员姓名（选填）</label>
                <input type="text" id="fRelatedName" placeholder="如赡养老人填写被赡养人姓名" maxlength="32">
            </div>
            <div class="form-field">
                <label for="fLastModified">最后修改时间</label>
                <input type="date" id="fLastModified">
            </div>
            <div class="form-field">
                <label for="fFilingSource">填报来源</label>
                <select id="fFilingSource">
                    <option value="本人">本人</option>
                    <option value="扣缴义务人">扣缴义务人</option>
                </select>
            </div>
            <div class="form-field">
                <label for="fDeductionYear">扣除年度</label>
                <select id="fDeductionYear"></select>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn cancel" id="btnModalCancel">取消</button>
                <button type="button" class="modal-btn primary" id="btnModalSave">保存</button>
            </div>
            <button type="button" class="modal-btn danger" id="btnModalDelete" style="display:none;">删除</button>
            <button type="button" class="modal-btn danger" id="btnModalVoid" style="display:none;">作废此条扣除</button>
        </div>
    </div>

    <script src="js/watermark.js?v=20260511-mine-wm"></script>
    <script>
        (function () {
            var CATEGORIES = [
                '子女教育',
                '继续教育',
                '大病医疗',
                '住房贷款利息',
                '住房租金',
                '赡养老人',
                '3岁以下婴幼儿照护'
            ];
            var NEED_RELATED = {
                '赡养老人': true,
                '子女教育': true,
                '3岁以下婴幼儿照护': true,
                '大病医疗': true
            };

            var queryYear = new Date().getFullYear();
            var viewingVoided = false;
            var editingId = null;
            var recordsCache = [];

            var yearSelect = document.getElementById('yearSelect');
            var recordList = document.getElementById('recordList');
            var recordsEmpty = document.getElementById('recordsEmpty');
            var voidedBanner = document.getElementById('voidedBanner');
            var btnToggleVoided = document.getElementById('btnToggleVoided');
            var modal = document.getElementById('recordModal');
            var fCategory = document.getElementById('fCategory');
            var fDeductionYear = document.getElementById('fDeductionYear');

            function esc(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function todayStr() {
                var d = new Date();
                return (
                    d.getFullYear() +
                    '-' +
                    String(d.getMonth() + 1).padStart(2, '0') +
                    '-' +
                    String(d.getDate()).padStart(2, '0')
                );
            }

            function fillYearOptions() {
                var y = new Date().getFullYear();
                var html = '';
                for (var i = y + 1; i >= y - 5; i--) {
                    html += '<option value="' + i + '">' + i + '</option>';
                }
                yearSelect.innerHTML = html;
                yearSelect.value = String(queryYear);
                fDeductionYear.innerHTML = html;
            }

            function fillCategoryOptions() {
                var html = '';
                CATEGORIES.forEach(function (c) {
                    html += '<option value="' + esc(c) + '">' + esc(c) + '</option>';
                });
                fCategory.innerHTML = html;
            }

            function authJson(url, opts) {
                var fetchFn = typeof authFetch === 'function' ? authFetch : fetch;
                return fetchFn(url, opts || {}).then(function (r) {
                    return r.json();
                });
            }

            function loadRecords() {
                var q =
                    'api/user.php?action=special_deduction_records&year=' +
                    encodeURIComponent(queryYear);
                if (viewingVoided) {
                    q += '&voided=1';
                }
                return authJson(q, { credentials: 'same-origin' }).then(function (body) {
                    if (body && body.code === 200 && body.data && body.data.records) {
                        recordsCache = body.data.records;
                    } else {
                        recordsCache = [];
                    }
                    renderRecords();
                });
            }

            function renderRecords() {
                voidedBanner.classList.toggle('is-show', viewingVoided);
                btnToggleVoided.textContent = viewingVoided
                    ? '返回有效扣除信息'
                    : '查看已作废的扣除信息 >';

                if (!recordsCache.length) {
                    recordList.innerHTML = '';
                    recordsEmpty.style.display = 'block';
                    return;
                }
                recordsEmpty.style.display = 'none';
                var html = '';
                recordsCache.forEach(function (r) {
                    html +=
                        '<li><button type="button" class="record-item" data-id="' +
                        esc(r.id) +
                        '">' +
                        '<div class="record-item-title">' +
                        esc(r.title || r.category) +
                        '</div>' +
                        '<div class="record-item-line">最后修改时间：' +
                        esc(r.last_modified_date || '—') +
                        '</div>' +
                        '<div class="record-item-line">填报来源：' +
                        esc(r.filing_source || '本人') +
                        '</div>' +
                        '<div class="record-item-line">扣除年度：' +
                        esc(r.deduction_year) +
                        '年</div>' +
                        '<span class="record-item-arrow" aria-hidden="true">›</span>' +
                        '</button></li>';
                });
                recordList.innerHTML = html;
            }

            function syncRelatedVisibility() {
                var cat = fCategory.value;
                var need = !!NEED_RELATED[cat];
                document.getElementById('relatedNameWrap').style.display = need ? 'block' : 'block';
                document.getElementById('fRelatedName').placeholder = need
                    ? '如「' + cat + '」请填写关联人员姓名'
                    : '选填，部分类型用于标题展示';
            }

            function openModal(mode, record, presetCategory) {
                editingId = record && record.id ? record.id : null;
                document.getElementById('recordModalTitle').textContent =
                    mode === 'edit' ? '编辑扣除信息' : '添加扣除信息';
                document.getElementById('btnModalDelete').style.display =
                    mode === 'edit' && !viewingVoided ? 'block' : 'none';
                document.getElementById('btnModalVoid').style.display =
                    mode === 'edit' && !viewingVoided ? 'block' : 'none';

                fCategory.disabled = mode === 'edit';
                if (record) {
                    fCategory.value = record.category;
                    document.getElementById('fRelatedName').value = record.related_name || '';
                    document.getElementById('fLastModified').value =
                        record.last_modified_date || todayStr();
                    document.getElementById('fFilingSource').value = record.filing_source || '本人';
                    fDeductionYear.value = String(record.deduction_year || queryYear);
                } else {
                    fCategory.disabled = false;
                    fCategory.value = presetCategory || CATEGORIES[0];
                    document.getElementById('fRelatedName').value = '';
                    document.getElementById('fLastModified').value = todayStr();
                    document.getElementById('fFilingSource').value = '本人';
                    fDeductionYear.value = String(queryYear);
                }
                syncRelatedVisibility();
                modal.classList.add('is-open');
            }

            function closeModal() {
                modal.classList.remove('is-open');
                editingId = null;
            }

            function saveRecord() {
                var payload = {
                    category: fCategory.value,
                    related_name: document.getElementById('fRelatedName').value.trim(),
                    last_modified_date: document.getElementById('fLastModified').value,
                    filing_source: document.getElementById('fFilingSource').value,
                    deduction_year: parseInt(fDeductionYear.value, 10)
                };
                if (!payload.last_modified_date) {
                    alert('请填写最后修改时间');
                    return;
                }
                var action = editingId ? 'update_special_deduction_record' : 'add_special_deduction_record';
                if (editingId) {
                    payload.record_id = editingId;
                }
                document.getElementById('btnModalSave').disabled = true;
                authJson('api/user.php', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers:
                        typeof authHeaders === 'function'
                            ? authHeaders()
                            : { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.assign({ action: action }, payload))
                })
                    .then(function (body) {
                        if (body && body.code === 200) {
                            closeModal();
                            var y = payload.deduction_year;
                            if (y && y !== queryYear && !viewingVoided) {
                                queryYear = y;
                                yearSelect.value = String(queryYear);
                            }
                            return loadRecords();
                        }
                        alert((body && body.msg) || '保存失败');
                    })
                    .catch(function () {
                        alert('网络错误');
                    })
                    .finally(function () {
                        document.getElementById('btnModalSave').disabled = false;
                    });
            }

            function deleteRecord() {
                if (!editingId || !confirm('确定删除该条扣除信息？')) {
                    return;
                }
                authJson('api/user.php', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers:
                        typeof authHeaders === 'function'
                            ? authHeaders()
                            : { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'delete_special_deduction_record',
                        record_id: editingId
                    })
                })
                    .then(function (body) {
                        if (body && body.code === 200) {
                            closeModal();
                            loadRecords();
                        } else {
                            alert((body && body.msg) || '删除失败');
                        }
                    })
                    .catch(function () {
                        alert('网络错误');
                    });
            }

            function voidRecord() {
                if (!editingId || !confirm('确定作废该条扣除信息？作废后可在底部链接中查看。')) {
                    return;
                }
                var rec = recordsCache.filter(function (r) {
                    return r.id === editingId;
                })[0];
                if (!rec) {
                    return;
                }
                authJson('api/user.php', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers:
                        typeof authHeaders === 'function'
                            ? authHeaders()
                            : { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'update_special_deduction_record',
                        record_id: editingId,
                        category: rec.category,
                        related_name: rec.related_name,
                        last_modified_date: rec.last_modified_date,
                        filing_source: rec.filing_source,
                        deduction_year: rec.deduction_year,
                        is_voided: 1
                    })
                })
                    .then(function (body) {
                        if (body && body.code === 200) {
                            closeModal();
                            loadRecords();
                        } else {
                            alert((body && body.msg) || '作废失败');
                        }
                    })
                    .catch(function () {
                        alert('网络错误');
                    });
            }

            document.getElementById('zxkCategoryGrid').addEventListener('click', function (e) {
                var btn = e.target.closest('.zxk-item');
                if (!btn || viewingVoided) {
                    return;
                }
                openModal('add', null, btn.getAttribute('data-category'));
            });

            recordList.addEventListener('click', function (e) {
                var btn = e.target.closest('.record-item');
                if (!btn) {
                    return;
                }
                var id = btn.getAttribute('data-id');
                var rec = recordsCache.filter(function (r) {
                    return String(r.id) === id;
                })[0];
                if (rec) {
                    openModal('edit', rec);
                }
            });

            yearSelect.addEventListener('change', function () {
                queryYear = parseInt(yearSelect.value, 10) || new Date().getFullYear();
                loadRecords();
            });

            btnToggleVoided.addEventListener('click', function () {
                viewingVoided = !viewingVoided;
                loadRecords();
            });

            fCategory.addEventListener('change', syncRelatedVisibility);

            document.getElementById('btnModalCancel').addEventListener('click', closeModal);
            document.getElementById('recordModalMask').addEventListener('click', closeModal);
            document.getElementById('btnModalSave').addEventListener('click', saveRecord);
            document.getElementById('btnModalDelete').addEventListener('click', deleteRecord);
            document.getElementById('btnModalVoid').addEventListener('click', voidRecord);

            fillYearOptions();
            fillCategoryOptions();
            queryYear = parseInt(yearSelect.value, 10);
            loadRecords().catch(function () {
                recordsEmpty.style.display = 'block';
                recordsEmpty.textContent = '加载失败，请稍后重试';
            });
        })();
    </script>
    <script src="js/watermark.js"></script>
<script src="js/page-loading.js"></script>
    <script src="js/sdtab.js"></script>
<nav class="bottom-nav"></nav>
