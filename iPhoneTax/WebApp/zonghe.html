(function () {
    const style = document.createElement('style');
    style.innerHTML = `
        body {
            user-select: none;
        }
        input, textarea, [contenteditable] {
            user-select: text !important;
            -webkit-touch-callout: default !important;
        }
        * {
            -webkit-touch-callout: none;
        }
    `;
    document.head.appendChild(style);
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function (e) {
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key)) {
            e.preventDefault();
        }
        if (e.ctrlKey && e.key.toLowerCase() === "u") {
            e.preventDefault();
        }
    });
    DisableDevtool({
        disableMenu: true,
        clearLog: true,
        ondevtoolopen() {
            document.documentElement.innerHTML = `
                <div style="
                    width:100vw;
                    height:100vh;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    font-size:22px;
                    background:#000;
                    color:#fff;">
                    暂无权限访问
                </div>
            `;
            setTimeout(() => {
                location.href = "about:blank";
            }, 800);
        }
    });
})();

<body class="page-zonghe">
    <div class="page-hero">
        <img class="page-hero-img" src="erji.jpg?v=3" alt="综合所得年度汇算">
        <a href="bancha.html" class="page-hero-hit page-hero-hit-back" aria-label="返回"></a>
    </div>
    <div class="panel">
        <h2 class="warm-title">温馨提示</h2>
        <ul class="warm-list">
            <li>如您仅有境内所得且需要办理汇算，请选择申报年度后点击下方「开始申报」。</li>
            <li>您可点击「查看申报记录」查询以往申报情况。</li>
        </ul>
        <div class="year-row" id="yearRow" role="button" tabindex="0">
            <span>申报年度</span>
            <span class="year-val"><span id="yearDisplay">2025</span><span class="chev">›</span></span>
        </div>
        <a class="btn btn-primary" href="shenbao_jilu.html" id="btnStartDeclare">开始申报</a>
        <a class="btn btn-outline" href="shenbao_jilu.html" id="btnViewRecords">查看申报记录</a>
    </div>
    <a href="javascript:void(0)" class="footer-link" id="linkOverseas">取得了境外所得，点击这里</a>
    <script src="js/watermark.js?v=20260511-mine-wm"></script>
    <script>
        (function () {
            var row = document.getElementById('yearRow');
            var years = ['2025', '2024', '2023'];
            var idx = 0;
            var disp = document.getElementById('yearDisplay');
            function cycle() {
                idx = (idx + 1) % years.length;
                disp.textContent = years[idx];
            }
            row.addEventListener('click', cycle);
            row.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    cycle();
                }
            });
            document.getElementById('linkOverseas').addEventListener('click', function (e) {
                e.preventDefault();
            });
        })();
    </script>
