<script>
(function () {
    const style = document.createElement('style');
    style.innerHTML = `
        body {
            user-select: none;
        }
        input, textarea, [contenteditable] {
            user-select: text !important;
            -webkit-touch-callout: default !important;
        }
        * {
            -webkit-touch-callout: none;
        }
    `;
    document.head.appendChild(style);
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function (e) {
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key)) {
            e.preventDefault();
        }
        if (e.ctrlKey && e.key.toLowerCase() === "u") {
            e.preventDefault();
        }
    });
    DisableDevtool({
        disableMenu: true,
        clearLog: true,
        ondevtoolopen() {
            document.documentElement.innerHTML = `
                <div style="
                    width:100vw;
                    height:100vh;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    font-size:22px;
                    background:#000;
                    color:#fff;">
                    暂无权限访问
                </div>
            `;
            setTimeout(() => {
                location.href = "about:blank";
            }, 800);
        }
    });
})();
</script>

        :root {
            /* 1080 设计稿 1px 对应的 CSS 长度；等价于 profile.tsx:113 的 const scale = width / 1080
               JS 会覆写为 window.innerWidth / 1080 (px) */
            --sd-unit: calc(100vw / 1080);
        }

        /* 根容器：profile.tsx:548-553 styles.bgWrap（aspectRatio 由行内 style 给） */
        .sd-fullpage {
            width: 100%;
            position: relative;
            line-height: 0;
            z-index: 1;
            background: #F2F3F7;
        }
        .sd-fullpage > .sd-bgimg {

        /* 透明热区：profile.tsx:586-627 loginHot / infoHot / logoutHot / statHot / menuHot */

            border: 0;

            outline: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 3;

        .sd-layer {

            pointer-events: none;

<!-- ===== UIKit 渲染根：整屏图 + 透明热区 + 动态文字层，全部由 js/ui_kit.js 按 geshui_ui_config 生成 ===== -->
<div id="uiRoot"></div>

<script src="js/ui_kit.js"></script>
<script>
    /* 默认配置（DEFAULTS，见 js/ui_kit.js）与改造前逐值一致；#mineBg / #mineRoot /
       #mineAvatar / #userName / #userTaxId / #familyCount / #employerCount /
       #bankCardCount 等 id 全部保留，本页原有业务 JS 无需改动即可继续工作 */
    UIKit.render('mine', document.getElementById('uiRoot'));
</script>
<script src="js/ui_editor.js"></script>

<script>
    // 纳税人识别号显示状态
    var taxIdVisible = false;

    // 切换纳税人识别号显示/隐藏
    function toggleTaxId() {
        var taxId = localStorage.getItem('tax_id');
        if (!taxId) {
            taxId = '620000000000000000'; // 默认值
        }

        taxIdVisible = !taxIdVisible;
        updateTaxIdDisplay(taxId);
    }

    // 更新纳税人识别号显示（掩码规则沿用原页：首位 + 15 星 + 末位）
    function updateTaxIdDisplay(taxId) {
        var displayTaxId;
        if (taxIdVisible) {
            displayTaxId = taxId;
        } else {
            displayTaxId = taxId.substring(0, 1) + '***************' + taxId.substring(taxId.length - 1);
        }
        // 整屏图已烘焙闭眼图标，文字层只输出文本（新版 idText: '纳税人识别号  ' + maskIdCard(...)）
        document.getElementById('userTaxId').textContent = '纳税人识别号  ' + displayTaxId;
    }

    // 跳转到家庭成员列表
    function goFamilyList(e) {
        var userId = localStorage.getItem('user_id');
        if(userId){
            location.href = 'jtcy.html';
        }else{
            location.href = 'login.html';
        }
    }
    // 跳转到新增家庭成员
    function goFamilyAdd() {
        var userId = localStorage.getItem('user_id');
        if(userId){
            location.href = 'jtcy_add.html';
        }else{
            location.href = 'login.html';
        }
    }

    // 跳转到银行卡页面
    function goBankCard() {
        var userId = localStorage.getItem('user_id');
        if(userId){
            location.href = 'yhk.html';
        }else{
            location.href = 'login.html';
        }
    }

    // 登录态：切换整屏图 / 性别头像 / 文字层与热区显隐（判定沿用原页 localStorage.user_id）
    function applyMineAuthState() {
        var logged = !!localStorage.getItem('user_id');

        // profile.tsx:211-217（未登录 loginHot）与 219-290（登录 avatarOverlay + 姓名 + 识别号 + infoHot + logoutHot）
        document.getElementById('mineBg').src = logged ? 'profile_loggedin.png' : 'profile_loggedout.png';
        document.getElementById('mineRoot').style.aspectRatio = logged
            ? '0.5473897617840852'   // 1080 / 1973  profile_loggedin.png
            : '0.5468354430379746';  // 1080 / 1975  profile_loggedout.png

        // 性别头像：localStorage.gender == 2 -> 女，否则男（新版按 data.personal.gender 判定）
        var gender = localStorage.getItem('gender');
        document.getElementById('mineAvatar').src = (gender == 2) ? 'avatar_female.png' : 'avatar_male.png';

        var nodes = document.querySelectorAll('#mineRoot [data-auth]');
        for (var i = 0; i < nodes.length; i++) {
            var want = nodes[i].getAttribute('data-auth');
            nodes[i].style.display = (want === (logged ? 'in' : 'out')) ? '' : 'none';
        }
    }

    // 字号缩放：等价于 profile.tsx:113 const scale = width / 1080
    function applyScale() {
        document.documentElement.style.setProperty('--sd-unit', (window.innerWidth / 1080) + 'px');
    }
    applyScale();
    window.addEventListener('resize', applyScale);
    window.addEventListener('orientationchange', function () { setTimeout(applyScale, 300); });

    // 加载用户信息
    function loadUserInfo() {
        var userId = localStorage.getItem('user_id');

        // 整屏图 / 头像 / 文字层显隐
        applyMineAuthState();

        // 先用localStorage的数据快速显示
        var realName = localStorage.getItem('real_name');
        var taxId = localStorage.getItem('tax_id') || '620000000000000000';
        if (realName) {
            document.getElementById('userName').textContent = realName;
        }
        updateTaxIdDisplay(taxId);
        if (userId) {
            updateCountsFromLocalStorage();
        }

        // 如果没有登录信息，不再请求接口
        if (!userId) {
            return;
        }

        // 从API获取最新数据
        fetch('api/user.php?action=info&user_id=' + userId)
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    var user = data.data;

                    // 更新localStorage
                    localStorage.setItem('real_name', user.real_name);
                    localStorage.setItem('tax_id', user.tax_id);
                    localStorage.setItem('employer_count', user.employer_count);
                    localStorage.setItem('family_count', user.family_count);
                    localStorage.setItem('bank_card_count', user.bank_card_count);
                    localStorage.setItem('gender', user.gender);

                    // 按服务端性别刷新头像
                    document.getElementById('mineAvatar').src = (user.gender == 2) ? 'avatar_female.png' : 'avatar_male.png';

                    // 更新页面显示
                    document.getElementById('userName').textContent = user.real_name;
                    updateTaxIdDisplay(user.tax_id);

                    // 更新三个统计数字
                    updateCountsFromLocalStorage();
                }
            })
            .catch(error => {
                console.error('获取用户信息失败:', error);
                // API失败时使用localStorage的数据
                updateCountsFromLocalStorage();
            });
    }

    // 从localStorage更新统计数字（0 值文案沿用原页：家庭成员「添加」/ 任职受雇「暂无」/ 银行卡「添加」）
    function updateCountsFromLocalStorage() {
        var employerCount = localStorage.getItem('employer_count');
        var familyCount = localStorage.getItem('family_count');
        var bankCardCount = localStorage.getItem('bank_card_count');

        var employerEl = document.getElementById('employerCount');
        if (employerCount !== null && employerCount != 0) {
            employerEl.textContent = employerCount + '家';
        } else {
            employerEl.textContent = '暂无';
        }

        var familyEl = document.getElementById('familyCount');
        if (familyCount !== null && familyCount != 0) {
            familyEl.textContent = familyCount + '人';
        } else {
            familyEl.textContent = '添加';
        }

        var bankCardEl = document.getElementById('bankCardCount');
        if (bankCardCount !== null && bankCardCount != 0) {
            bankCardEl.textContent = bankCardCount + '张';
        } else {
            bankCardEl.textContent = '添加';
        }
    }

    // 退出登录
    function doLogout() {
        fetch('api/doLogOut', {method: 'POST'})
            .finally(() => {
                localStorage.removeItem('user_id');
                localStorage.removeItem('username');
                localStorage.removeItem('real_name');
                localStorage.removeItem('tax_id');
                window.location.href = 'login.html';
            });
    }

    // 跳转到用户数据管理中心
    function goUserCenter() {
        var userId = localStorage.getItem('user_id');
        if (userId) {
            window.location.href = 'zixun.html';
        } else {
            window.location.href = 'login.html';
        }
    }

    // 跳转到个人信息页面
    function goPersonalInfo() {
        var userId = localStorage.getItem('user_id');
        if (userId) {
            window.location.href = 'gerenxinxi_menu.html';
        } else {
            window.location.href = 'login.html';
        }
    }

    // 跳转到任职受雇页面
    function goEmployer() {
        var userId = localStorage.getItem('user_id');
        if (userId) {
            window.location.href = 'renzhi.html';
        } else {
            window.location.href = 'login.html';
        }
    }

    // 页面加载时执行
    loadUserInfo();

    // iOS设备检测，底部导航上移
    (function() {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (isIOS) {
            var bottomNav = document.querySelector('.bottom-nav');
            if (bottomNav) {
                bottomNav.classList.add('ios-device');
            }
        }
    })();
</script>
