</div>

<script>
var dbKey = 'geshui_orgs';
function getList() { try { return JSON.parse(localStorage.getItem(dbKey)) || []; } catch(e) { return []; } }
function setList(l) { localStorage.setItem(dbKey, JSON.stringify(l)); }
function seed() {
    var l = getList();
    if (l.length) return;
    l = [
        { id: 1, name: '北京华税税务师事务所有限公司', credit_no: '91110108MA01XXXXX', level: 'AAAAA级' },
        { id: 2, name: '上海中汇会计师事务所', credit_no: '91310115MA1XXXXX', level: 'AAAA级' },
        { id: 3, name: '广州金穗税务师事务所', credit_no: '91440101MA9XXXXX', level: 'AAA级' }
    ];
    setList(l);
}
function render() {
    seed();
    var list = getList();
    var html = '';
    if (!list.length) html = '<div class="empty">暂无机构信息</div>';
    list.forEach(function(item) {
        html += '<div class="list-item"><div class="list-header"><span class="list-title">' + item.name + '</span><span class="list-date">' + item.level + '</span></div>';
        html += '<div class="list-row">统一社会信用代码：' + item.credit_no + '</div></div>';
    });
    document.getElementById('orgList').innerHTML = html;
}
render();
</script>
