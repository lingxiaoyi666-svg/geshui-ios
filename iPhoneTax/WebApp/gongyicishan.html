<body class="page-gongyicishan">
    <header class="header">
        <a href="bancha.html" class="back-btn" aria-label="返回">
            <img src="jt.png" class="back-icon" alt="">
            <span>返回</span>
        </a>
        <h1 class="header-title">公益慈善捐赠扣除填报</h1>
    </header>

    <div class="hero" aria-hidden="true"></div>

    <section class="tips-box">
        <h2 class="tips-title">温馨提示</h2>
        <p class="tips-item">税款所属年度自2025年起，您可通过本功能录入准予扣除的捐赠记录，并支持选择由扣缴义务人逐月扣除或年度汇算时扣除。</p>
    </section>

    <div class="form-card">
        <button type="button" class="form-row" id="pickYearBtn">
            <span class="form-label">填报年度</span>
            <span class="form-value" id="yearLabel">请选择填报年度</span>
            <span class="form-arrow" aria-hidden="true">›</span>
        </button>
    </div>

    <div class="footer-actions">
        <button type="button" class="btn-primary" id="btnFile">填报捐赠扣除</button>
        <a href="javascript:void(0)" class="footer-link" id="viewDeductionLink">查看我的扣除信息</a>
    </div>

    <div class="year-overlay" id="yearOverlay" aria-hidden="true">
        <div class="year-sheet" role="dialog">
            <div class="year-sheet-hd">
                <button type="button" class="cancel" id="yearCancel">取消</button>
                <span>选择填报年度</span>
                <button type="button" id="yearOk">确定</button>
            </div>
            <div class="year-list" id="yearList"></div>
        </div>
    </div>

    <script>
        (function () {
            var yearLabel = document.getElementById('yearLabel');
            var overlay = document.getElementById('yearOverlay');
            var yearList = document.getElementById('yearList');
            var selectedYear = '';
            var pendingYear = '';

            var now = new Date().getFullYear();
            var years = [];
            for (var y = now; y >= 2025; y--) years.push(String(y));

            years.forEach(function (yr) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'year-opt';
                btn.textContent = yr + '年';
                btn.setAttribute('data-year', yr);
                btn.addEventListener('click', function () {
                    pendingYear = yr;
                    yearList.querySelectorAll('.year-opt').forEach(function (el) {
                        el.style.color = el.getAttribute('data-year') === yr ? '#1677ff' : '#333';
                        el.style.fontWeight = el.getAttribute('data-year') === yr ? '600' : '400';
                    });
                });
                yearList.appendChild(btn);
            });

            function openYearPicker() {
                pendingYear = selectedYear || String(now);
                overlay.classList.add('is-open');
                overlay.setAttribute('aria-hidden', 'false');
            }
            function closeYearPicker() {
                overlay.classList.remove('is-open');
                overlay.setAttribute('aria-hidden', 'true');
            }

            document.getElementById('pickYearBtn').addEventListener('click', openYearPicker);
            document.getElementById('yearCancel').addEventListener('click', closeYearPicker);
            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) closeYearPicker();
            });
            document.getElementById('yearOk').addEventListener('click', function () {
                if (pendingYear) {
                    selectedYear = pendingYear;
                    yearLabel.textContent = selectedYear + '年';
                    yearLabel.classList.add('has-val');
                }
                closeYearPicker();
            });

            document.getElementById('btnFile').addEventListener('click', function () {
                if (!selectedYear) {
                    alert('请选择填报年度');
                }
            });
            document.getElementById('viewDeductionLink').addEventListener('click', function () {});
        })();
    </script>
